<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">AC & DC Chargers | Premium EV Solutions</title>
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/mymobile.png" alt="Mymobile Logo" class="logo-img">
                </a>
            </div>

            <nav class="navbar" id="mobileNavMenu">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span data-i18n="home">Home</span>
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a href="product.html" class="nav-link dropdown-toggle">
                            <div class="charger-icon">
                                <i class="fas fa-bolt ac-icon-small"></i>
                                <i class="fas fa-plug dc-icon-small"></i>
                            </div>
                            <span data-i18n="chargers">Chargers</span>
                            <i class="fas fa-chevron-down dropdown-icon"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="product.html" class="charger-option">
                                    <div class="charger-type ac-option">
                                        <div class="wave-small"></div>
                                        <span data-i18n="acChargers">AC Chargers</span>
                                    </div>
                                    <small data-i18n="acDesc">AC: portable, wall-mounted</small>
                                </a>
                            </li>
                            <li>
                                <a href="product.html" class="charger-option">
                                    <div class="charger-type dc-option">
                                        <div class="battery-small">
                                            <div class="pos-small"></div>
                                            <div class="neg-small"></div>
                                        </div>
                                        <span data-i18n="dcChargers">DC Chargers</span>
                                    </div>
                                    <small data-i18n="dcDesc">Direct Current Fast Charging</small>
                                </a>
                            </li>
                            <li class="dropdown-divider"></li>
                            <li>
                                <a href="product.html" class="all-products">
                                    <i class="fas fa-bolt-lightning"></i>
                                    <span data-i18n="allProducts">All Charging Products</span>
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a href="aboutus.html" class="nav-link dropdown-toggle">
                            <i class="fas fa-info-circle"></i>
                            <span data-i18n="about">About Us</span>
                            <i class="fas fa-chevron-down dropdown-icon"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="aboutus.html" class="charger-option">
                                    <i class="fas fa-users"></i>
                                    <span data-i18n="whoWeAre">Who We Are</span>
                                </a>
                            </li>
                            <li>
                                <a href="aboutus.html" class="charger-option">
                                    <i class="fas fa-award"></i>
                                    <span data-i18n="certification">Certification</span>
                                </a>
                            </li>
                            <li class="dropdown-divider"></li>
                            <li>
                                <a href="#" class="all-products" id="openContactModal">
                                    <i class="fas fa-envelope"></i>
                                    <span data-i18n="contact">Contact Us</span>
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fas fa-images"></i>
                            <span data-i18n="gallery">Gallery</span>
                        </a>
                    </li>

                    <li class="nav-item mobile-lang-switcher-item">
                        <div class="language-switcher mobile-visible">
                            <div class="lang-dropdown">
                                <button class="lang-option" data-lang="en">
                                    <img src="https://flagcdn.com/w20/us.png" class="flag-image option-flag" alt="EN">
                                    <span class="lang-name">English</span>
                                </button>
                                <button class="lang-option" data-lang="ka">
                                    <img src="https://flagcdn.com/w20/ge.png" class="flag-image option-flag" alt="KA">
                                    <span class="lang-name">ქართული</span>
                                </button>
                            </div>
                        </div>
                    </li>
                </ul>
            </nav>

            <div class="header-right-group">
                <div class="language-switcher" id="languageSwitcherDesktop">
                    <button class="lang-btn" id="langToggle">
                        <div class="dual-flags">
                            <img src="https://flagcdn.com/w20/us.png" class="flag-image current-flag" alt="EN">
                            <img src="https://flagcdn.com/w20/ge.png" class="flag-image secondary-flag" alt="KA">
                        </div>
                        <span class="lang-code">EN</span>
                        <i class="fas fa-chevron-down lang-arrow"></i>
                    </button>
                    <div class="lang-dropdown" id="langDropdownDesktop">
                        <button class="lang-option" data-lang="en">
                            <img src="https://flagcdn.com/w20/us.png" class="flag-image option-flag" alt="EN">
                            <span class="lang-name">English</span>
                            <span class="lang-code-option">EN</span>
                        </button>
                        <button class="lang-option" data-lang="ka">
                            <img src="https://flagcdn.com/w20/ge.png" class="flag-image option-flag" alt="KA">
                            <span class="lang-name">ქართული</span>
                            <span class="lang-code-option">KA</span>
                        </button>
                    </div>
                </div>

                <div class="mobile-menu-btn" id="mobileMenuToggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <div id="contactModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeContactModal" class="close-btn">&times;</span>
            <h2 data-i18n="contact">Contact Us</h2>
            <form id="contactForm">
                <input type="text" data-i18n="contactName" placeholder="Name" required>
                <input type="email" data-i18n="contactEmail" placeholder="Email" required>
                <textarea data-i18n="contactMsg" placeholder="How can we help?"></textarea>
                <button type="submit" class="main-button" data-i18n="contactBtn">Send Message</button>
            </form>
        </div>
    </div>
    <main class="product-fullscreen-container" id="productsContainer">
    </main>
    <script src="product.js"></script>
</body>
